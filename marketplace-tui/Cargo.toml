[package]
name = "marketplace-tui"
version = "0.1.0"
edition = "2021"
description = "A terminal user interface for managing AWS Marketplace machine learning product listings"

[dependencies]
ratatui = "0.29"
crossterm = "0.29.0"
aws-config = { version = "1.8.8", features = ["behavior-version-latest"] }
aws-sdk-marketplacecatalog = "1.0"
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0"
chrono = "0.4"
regex = "1.11"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
